# config.yaml
features:
  use_fingerprints: true
  use_descriptors: true
  tune_fp_radius: false
  fp_radius: 3
  fp_size: 512

target: hac_weighted_score   # your TARGET column name
molecule_col: molecule       # SMILES column name

cross_validation:
  seeds: [0, 1, 2, 3, 4]
  n_folds: 5

tracking:
  wandb_project: protac-synth
  study_prefix: v1

torch:                   # for the MLP/GNN later
  device: auto           # auto | cpu | cuda | mps
  max_epochs: 500
  patience: 20