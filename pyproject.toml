[project]
name = "retrotac"
version = "0.1.0"
description = "PROTAC synthesizability scoring pipeline"
readme = "README.md"
requires-python = "==3.12.*"
# Core inference dependencies — everything a regular user needs to run the
# trained models (see scripts/models/predict.py). Heavier or task-specific
# tooling lives in the optional groups below (install with `uv sync --extra
# training` / `--extra scoring`). These three groups map 1:1 onto the three
# Apptainer container profiles under apptainer/ (inference is the default —
# no extra needed — since that's what most users only ever need).
dependencies = [
    "rdkit>=2023.9.1",
    # Data science core
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.7,<1.8",
    "xgboost>=2.0,<3.0",
    # ML tooling
    "autorank>=1.3",
    "skops>=0.14",
    "chemprop>=2.2.4",
    "torchmetrics>=1.9.0",
    # Utilities
    "tqdm>=4.67",
    "tabulate>=0.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "dotenv>=0.9.9",
    "huggingface-hub>=0.17",
    "optuna>=4.2",
]

[project.optional-dependencies]
# Training extras: model training/tracking, dataset handling, plotting,
# statistics, and PROTAC splitting. Not needed for plain inference.
# -> apptainer/training.def
training = [
    # Experiment tracking & tuning
    "optuna-integration[pytorch-lightning]>=4.9.0",
    "wandb>=0.27",
    "lightning-utilities>=0.15.3",
    "torchdata>=0.11.0",
    # Datasets
    "datasets>=5.0.0",
    # Statistics
    "statsmodels>=0.14",
    "pingouin>=0.5",
    "scikit-posthocs>=0.9",
    # Plotting
    "matplotlib>=3.10",
    "matplotlib-venn>=1.1",
    "seaborn>=0.13",
    # PROTAC decomposition
    "protac-splitter",
]

# Molecule/route scoring: the lightweight, main-env half of the scoring
# pipeline (scripts/chem_mol_scoring/, scripts/chem_route_scoring/,
# retro_scores/route_scores/route_tree_score.py -- all pure rdkit/pandas,
# already covered by the core deps above) plus LLM-as-judge route scoring.
# The heavy SA/SC/RA/SYBA/GASA/FSscore stack (retro_scores/mol_scores/) is
# NOT expressible here -- it needs its own Python-3.10 environment built by
# hand per retro_scores/README.md; see apptainer/scoring.def, which bakes
# both halves into one image.
# -> apptainer/scoring.def
scoring = ["dspy>=2.6", "pydantic>=2.0"]

notebooks = ["jupyter>=1.1", "jupyterlab>=4.5", "ipywidgets>=7.8"]

# NOTE: the former `retrosynth` extra (aizynthfinder) has been dropped
# project-wide. Local AiZynthFinder-based route search
# (scripts/retrosynthesis/get_component_routes_and_scores.py,
# get_protac_routes_and_scores.py, retro_scores/route_scores/
# aizynthfinder_utils.py's live-search helpers, retrotac/stock_utils/)
# is superseded by routes supplied externally (see SCORING.md Sec. 3.2) and
# is no longer part of any supported environment or container. Those files
# are left in place but are unsupported until aizynthfinder is installed
# manually. This does NOT affect retro_scores/route_scores/hac_score.py
# (pure rdkit, no aizynthfinder needed) -- see the `scoring` extra above.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrotac*"]

[tool.uv]
# Install the project itself (editable) so `retrotac` imports from anywhere,
# not just the repo root.
package = true

[tool.uv.sources]
protac-splitter = { git = "https://github.com/ribesstefano/PROTAC-Splitter.git", rev = "version-update" }
