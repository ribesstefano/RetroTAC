[project]
name = "protac-synthesizability"
version = "0.1.0"
description = "PROTAC synthesizability scoring pipeline"
readme = "README.md"
requires-python = "==3.12.*"
# Core inference dependencies — everything a regular user needs to run the
# trained models. Heavier or task-specific tooling lives in the optional
# groups below (install with `uv sync --extra dev` / `--extra retrosynth`).
dependencies = [
    # Chemistry — stay in aizynthfinder's declared rdkit range
    "rdkit>=2023.9.1,<2024.0.0",
    # Data science core
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "xgboost>=2.0,<3.0",
    # ML tooling
    "autorank>=1.3",
    "skops>=0.14",
    "chemprop>=2.2.4",
    "torchmetrics>=1.9.0",
    # Utilities
    "tqdm>=4.67",
    "tabulate>=0.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
# Development extras: model training/tracking, dataset handling, plotting,
# statistics, and PROTAC splitting. Not needed for plain inference.
dev = [
    # Experiment tracking & tuning
    "optuna>=4.2",
    "optuna-integration[pytorch-lightning]>=4.9.0",
    "wandb>=0.27",
    "lightning-utilities>=0.15.3",
    "torchdata>=0.11.0",
    # Datasets
    "datasets>=5.0.0",
    # Statistics
    "statsmodels>=0.14",
    # Plotting
    "matplotlib>=3.10",
    "matplotlib-venn>=1.1",
    "seaborn>=0.13",
    # PROTAC decomposition
    "protac-splitter",
]

# Retrosynthetic analysis. aizynthfinder pins a wide dependency range and is
# only needed to (re)generate synthesizability scores, not for inference.
retrosynth = [
    "aizynthfinder==4.4.1",
]

# LLM-as-judge scoring of retrosynthesis routes
llm_scoring = [
    "dspy>=2.6",
    "pydantic>=2.0",
]

notebooks = [
    "jupyter>=1.1",
    "jupyterlab>=4.5",
    "ipywidgets>=7.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["protac_synth*"]

[tool.uv]
# Install the project itself (editable) so `protac_synth` imports from anywhere,
# not just the repo root.
package = true

[tool.uv.sources]
protac-splitter = { git = "https://github.com/ribesstefano/PROTAC-Splitter.git", rev = "refactor" }