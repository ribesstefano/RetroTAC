[project]
name = "protac-synthesizability"
version = "0.1.0"
description = "PROTAC synthesizability scoring pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Retrosynthesis
    "aizynthfinder==4.4.1",
    # Chemistry — stay in aizynthfinder's declared rdkit range
    "rdkit>=2023.9.1,<2024.0.0",
    # Data science core
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "xgboost>=2.0,<3.0",
    # ML tooling
    "optuna>=4.2",
    "wandb>=0.27",
    "autorank>=1.3",
    "skops>=0.14",
    # Visualization
    "matplotlib>=3.10",
    "matplotlib-venn>=1.1",
    "seaborn>=0.13",
    # Utilities
    "tqdm>=4.67",
    "tabulate>=0.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "datasets>=5.0.0",
    "dotenv>=0.9.9",
    "protac-splitter",
]

# protac-splitter is NOT included here because its 0.0.1 release ships
# an entire pip-freeze as exact-pinned deps, which conflicts with
# aizynthfinder on rdkit, networkx, pillow, urllib3, and more.
# Install it separately after `uv sync` — see setup_env.sh.

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1",
    "jupyterlab>=4.5",
    "ipywidgets>=7.8",
]

[tool.uv]
package = false

[tool.uv.sources]
protac-splitter = { git = "https://github.com/ribesstefano/PROTAC-Splitter.git", rev = "refactor" }
