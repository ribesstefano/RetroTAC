# AiZynthFinder configuration for full PROTAC retrosynthesis.
#
# Key differences from aizynthfinder_component_config.yaml:
#   - Higher time_limit (600 s vs 120 s): full PROTACs occupy a larger MCTS
#     search space than isolated, capped components.
#   - More max_transforms (16 vs 12): deeper retrosynthesis trees are needed
#     to reach purchasable precursors for large bifunctional molecules.
#   - MCTS hyperparameters (C, default_prior, search_rewards_weights)
#     calibrated via Optuna on full-PROTAC molecules.

expansion:
  uspto:
    - data/templates/uspto_model.onnx
    - data/templates/uspto_unique_templates.csv
  ringbreaker:
    - data/templates/uspto_ringbreaker_model.onnx
    - data/templates/uspto_ringbreaker_unique_templates.csv

filter:
  uspto: data/templates/uspto_filter_model.onnx

stock:
  zinc: data/external/zinc_stock.hdf5

search:
  return_first: true
  algorithm: mcts
  algorithm_config:
    C: 0.6272924049005918
    default_prior: 0.43194501864211576
    use_prior: true
    prune_cycles_in_search: true
    search_rewards:
      - "state score"
    immediate_instantiation: []
    mcts_grouping: null
    search_rewards_weights:
      - 0.40772079627725866
      - 0.9789646315558072
  max_transforms: 16
  iteration_limit: 2000
  time_limit: 600
  exclude_target_from_stock: true
  break_bonds: []
  freeze_bonds: []
  break_bonds_operator: and

expansion_policy: uspto
filter_policy: uspto
stock_policy:
    - default
