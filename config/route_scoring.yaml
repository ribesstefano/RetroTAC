# config/route_scoring.yaml
# ---------------------------------------------------------------------------
# Configuration for the tiered route-tree synthesizability scorer
# (retro_scores/route_scores/llm_scoring.py).
#
# All scoring behaviour is defined here so the source code stays immutable:
# pass this file with --config. Adjust weights/bands without editing code.
# ---------------------------------------------------------------------------

# Column names in the input CSV.
columns:
  smiles: SMILES       
  resolved: resolved   
  route: route         

# Weights for the structural-ease composite (need not sum to 1; normalised).
weights:
  lls: 0.50         
  coupling: 0.30    
  balance: 0.20     

# Transform settings. The length term uses RetroScore's parameter-free
transforms:
  neutral_balance: 0.5  # balance value used when a route has no 2+ reactant steps

# Anchors for the two empty-route cases (no tree, so ease can't be computed).
bands:
  ceiling: 1.0   # purchasable as-is
  floor: 0.0     # unsolved (no route found)